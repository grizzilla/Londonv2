<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Ivy London Explorer</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #app-container { display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-height: 0; }

    /* Compact, two-row control bar */
    #controls { background:#1e293b; color:#fff; padding:8px 12px; display:flex; flex-wrap:wrap; gap:7px 10px; align-items:center; z-index:1000; box-shadow:0 2px 8px rgba(0,0,0,.2); }
    .control-row { display:flex; align-items:center; gap:7px; min-width:0; }
    .control-row-search { flex:1 1 260px; }
    .control-row-filters { flex:0 1 auto; }
    #search-box { flex:1 1 180px; min-width:0; padding:8px 12px; border-radius:6px; border:1px solid #475569; background:#0f172a; color:#fff; font-size:14px; }
    #category-select { min-width:0; max-width: min(48vw, 300px); padding:8px 10px; border-radius:6px; border:1px solid #475569; background:#0f172a; color:#fff; font-size:14px; }
    .about-icon { width:36px; height:36px; padding:0; flex:0 0 36px; font-size:22px; line-height:1; border-radius:50%; }

    /* Type Filter Checkboxes */
    .filter-type-group {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      font-size: 13px;
    }
    .filter-type-label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
      font-weight: 500;
    }
    .filter-type-label input[type="checkbox"] {
      cursor: pointer;
      accent-color: #2563eb;
      width: 15px;
      height: 15px;
    }

    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:active { background: #1d4ed8; }

    /* Resizable map / location-list workspace */
    #main-content { display:flex; flex:1; min-height:0; min-width:0; overflow:hidden; }
    #sidebar { flex:0 0 330px; width:330px; min-width:180px; min-height:0; background:#f8fafc; border-right:1px solid #e2e8f0; display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; z-index:500; }
    #sidebar-header { position:sticky; top:0; z-index:2; padding:8px 10px; background:#f1f5f9; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; font-weight:700; color:#475569; text-transform:uppercase; letter-spacing:.35px; }
    .sidebar-heading { white-space:nowrap; }
    .sidebar-actions { display:flex; align-items:center; gap:5px; margin:0; flex:0 0 auto; }
    .sidebar-actions button { padding:5px 7px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; color:#334155; font-size:11px; font-weight:600; letter-spacing:0; text-transform:none; white-space:nowrap; cursor:pointer; }
    .sidebar-actions button:hover { background:#e2e8f0; }
    #resize-handle { flex:0 0 8px; background:#cbd5e1; cursor:col-resize; position:relative; z-index:600; touch-action:none; }
    #resize-handle::after { content:""; position:absolute; width:3px; height:34px; border-radius:3px; background:#64748b; left:50%; top:50%; transform:translate(-50%,-50%); }
    #resize-handle:hover, #resize-handle.dragging { background:#93c5fd; }
    #map { flex:1 1 auto; width:0; min-width:0; height:100%; }
    #sidebar-list { list-style: none; }
    .sidebar-item {
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .sidebar-item:hover { background: #e2e8f0; }
    .sidebar-title { font-size: 14px; font-weight: 600; color: #0f172a; margin-bottom: 4px; }
    .sidebar-sub { font-size: 12px; color: #64748b; margin-bottom: 6px; }
    .badge-container { display: flex; gap: 6px; align-items: center; }
    .sidebar-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
      text-transform: uppercase;
    }
    .badge-requested { background-color: #475569; }
    .badge-suggested { background-color: #0284c7; }

    #map { flex: 1; width: 100%; height: 100%; }

    /* SVG Pin Styling */
    .custom-svg-pin { background: transparent; border: none; }
    .custom-svg-pin svg { overflow:visible; filter: drop-shadow(0 2px 3px rgba(0,0,0,.58)); }

    /* Custom Popup Styles */
    .leaflet-popup-content-wrapper { border-radius: 8px; padding: 4px; max-width: 310px; }
    .popup-title-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; gap: 8px; }
    .popup-title { font-weight: 700; font-size: 15px; color: #0f172a; }
    .popup-cat { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
    .popup-row { font-size: 12px; color: #334155; margin-bottom: 4px; line-height: 1.4; }
    .popup-row strong { color: #0f172a; }
    .popup-link { margin-top: 8px; font-size: 12px; font-weight: 600; }
    .popup-link a { color: #2563eb; text-decoration: none; }


    /* Enriched Location Details */
    .sidebar-item { padding: 12px 14px; }
    .sidebar-detail {
      display: none;
      margin-top: 9px;
      padding-top: 9px;
      border-top: 1px solid #cbd5e1;
    }
    .sidebar-item.expanded .sidebar-detail { display: block; }
    .detail-row {
      font-size: 11px;
      color: #334155;
      margin: 0 0 5px 0;
      line-height: 1.42;
    }
    .detail-row strong { color: #0f172a; }
    .detail-specialty {
      margin-top: 7px;
      padding: 7px 8px;
      border-radius: 5px;
      background: #eef2ff;
      color: #1e293b;
      font-size: 11px;
      line-height: 1.4;
    }
    .popup-details {
      max-height: 310px;
      overflow-y: auto;
      padding-right: 3px;
    }
    .popup-section-label {
      margin: 8px 0 4px;
      font-size: 10px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .45px;
    }
    .data-note {
      font-size: 10px;
      color: #64748b;
      margin-top: 7px;
      line-height: 1.35;
    }

    .btn-secondary { background: #475569; }
    .btn-secondary:active { background: #334155; }

    /* Grouped sidebar */
    #sidebar-list, .cat-body { list-style: none; }
    .cat-group { border-bottom: 1px solid #e2e8f0; }
    .cat-header {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 14px;
      background: #f1f5f9;
      border: none;
      cursor: pointer;
      text-align: left;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
    }
    .cat-header:hover { background: #e2e8f0; }
    .cat-header.active-category { background:#dbeafe; box-shadow:inset 4px 0 0 var(--cat-color, #2563eb); }
    .cat-header.active-category .cat-name { color:#1d4ed8; }
    .cat-filter-button { border:0; background:transparent; color:#334155; font:inherit; font-weight:700; text-align:left; flex:1; min-width:0; padding:0; cursor:pointer; }
    .cat-expand-button { width:30px; height:30px; flex:0 0 30px; display:grid; place-items:center; border:1px solid #cbd5e1; border-radius:6px; background:#fff; color:#475569; cursor:pointer; touch-action:manipulation; }
    .cat-expand-button:focus-visible, .cat-filter-button:focus-visible { outline:2px solid #2563eb; outline-offset:2px; }
    .cat-chevron { font-size: 10px; color: #64748b; transition: transform 0.15s ease; width: 10px; }
    .cat-group.open .cat-chevron { transform: rotate(90deg); }
    .cat-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .cat-name { flex: 1; }
    .cat-count {
      font-size: 11px; font-weight: 700; color: #475569;
      background: #e2e8f0; border-radius: 10px; padding: 1px 8px;
    }
    .cat-body { display: none; background: #f8fafc; }
    .cat-group.open .cat-body { display: block; }
    .cat-body .sidebar-item:last-child { border-bottom: none; }

    /* About dialog */
    #about-overlay {
      display: none; position: fixed; inset: 0; z-index: 3000;
      background: rgba(15, 23, 42, 0.55); align-items: center; justify-content: center;
    }
    #about-overlay.show { display: flex; }
    #about-card {
      background: #fff; color: #0f172a; border-radius: 10px; padding: 20px 24px;
      width: min(360px, 90vw); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    #about-card h2 { font-size: 18px; margin-bottom: 12px; }
    .about-row { font-size: 14px; margin-bottom: 8px; color: #334155; }
    #about-card .btn { margin-top: 8px; }

    /* Multi-category chips, Must See badge, confidence note */
    .badge-must { background-color: #D4AF37; color: #1e293b; }
    .cat-chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 6px; }
    .cat-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: #334155; background: #e2e8f0; border-radius: 10px; padding: 1px 7px; }
    .cat-chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .popup-cats { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; line-height: 1.5; }
    .filter-type-label.must-label { color: #fcd34d; }
    .filter-type-label.must-label input { accent-color: #D4AF37; }

    /* Phone portrait: map above a vertically resizable bottom list. */
    @media (max-width: 700px) and (orientation: portrait) {
      #controls { padding:6px 8px; gap:5px; }
      .control-row-search { flex:1 1 100%; }
      .control-row-filters { flex:1 1 100%; }
      #category-select { flex:1 1 auto; max-width:none; }
      .control-row-filters .btn { padding:8px 9px; font-size:12px; white-space:nowrap; }
      .filter-type-group { width:100%; justify-content:space-around; gap:5px; padding:5px 7px; font-size:11px; }
      #main-content { flex-direction:column; }
      #map { order:0; width:100%; height:auto; flex:1 1 auto; min-height:100px; }
      #resize-handle { order:1; flex:0 0 10px; cursor:row-resize; }
      #resize-handle::after { width:38px; height:3px; }
      #sidebar { order:2; flex:0 0 34%; width:100%; min-width:0; min-height:90px; border-right:0; border-top:1px solid #e2e8f0; }
      #sidebar-header { padding:6px 9px; }
    }
    /* Phone landscape: list at left, map at right; drag the vertical divider. */
    @media (max-width: 900px) and (orientation: landscape) and (max-height: 600px) {
      #controls { padding:5px 8px; gap:5px 8px; }
      .control-row-search { flex:1 1 210px; }
      .control-row-filters { flex:1 1 auto; }
      .filter-type-group { padding:4px 7px; gap:8px; font-size:11px; }
      .control-row-filters .btn { padding:6px 8px; font-size:12px; }
      #main-content { flex-direction:row; }
      #sidebar { order:0; flex:0 0 38%; width:38%; min-width:170px; border-right:1px solid #e2e8f0; border-top:0; }
      #resize-handle { order:1; flex:0 0 8px; cursor:col-resize; }
      #resize-handle::after { width:3px; height:30px; }
      #map { order:2; flex:1 1 auto; width:0; }
      #sidebar-header { padding:5px 7px; }
      .sidebar-actions button { padding:4px 5px; font-size:10px; }
    }
    @media (min-width: 701px) {
      #sidebar { flex-basis:330px; }
    }
  </style>
</head>
<body>

<div id="app-container">
  <div id="controls">
    <div class="control-row control-row-search">
      <input type="text" id="search-box" placeholder="Search locations..." onkeyup="filterMarkers()" />
      <button class="btn btn-secondary about-icon" id="about-btn" onclick="showAbout()" aria-label="About" title="About">ⓘ</button>
    </div>
    <div class="control-row control-row-filters">
      <select id="category-select" onchange="catChanged()">
        <!-- categories are populated in the requested order -->
      </select>
      <button class="btn" onclick="resetFilters()">↺ Reset</button>
      <button class="btn" onclick="locateUser()">📍 Find Closest</button>
    </div>
    <div class="filter-type-group">
      <label class="filter-type-label"><input type="checkbox" id="chk-requested" checked onchange="filterMarkers(true)" /> Requested</label>
      <label class="filter-type-label"><input type="checkbox" id="chk-suggested" checked onchange="filterMarkers(true)" /> Suggested</label>
      <label class="filter-type-label must-label"><input type="checkbox" id="chk-must" onchange="mustChanged()" /> ★ Must See</label>
    </div>
  </div>
  <div id="main-content">
    <div id="sidebar">
      <div id="sidebar-header">
        <div class="sidebar-heading">Locations Shown (<span id="location-count">0</span>)</div>
        <div class="sidebar-actions">
          <button type="button" id="expand-all-btn" onclick="setAllGroups(true)">Expand all</button>
          <button type="button" id="collapse-all-btn" onclick="setAllGroups(false)">Collapse all</button>
        </div>
      </div>
      <ul id="sidebar-list"></ul>
    </div>
    <div id="resize-handle" role="separator" aria-label="Resize map and location list" aria-orientation="vertical" tabindex="0" title="Drag to resize map and location list"></div>
    <div id="map"></div>
  </div>
</div>

<!-- About dialog -->
<div id="about-overlay" onclick="if (event.target === this) hideAbout()">
  <div id="about-card" role="dialog" aria-modal="true" aria-labelledby="about-title">
    <h2 id="about-title">Team Ivy London Explorer</h2>
    <div class="about-row"><strong>Last revised:</strong> <span id="about-date"></span></div>
    <div class="about-row"><strong>Locations:</strong> <span id="about-count"></span></div>
    <button class="btn" onclick="hideAbout()">Close</button>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<!-- Location data + category colours (edit this file to add places) -->
<script src="locations.js"></script>

<script>

  const MUST_SEE = "MUST SEE";
  let pinSeq = 0;

  // Category colours remain segmented inside the pin. The independent Must See star
  // is a prominent dimensional gold overlay and never becomes a category segment.
  function createPinIcon(colors, mustSee) {
    const uid = ++pinSeq;
    const w = 25 / colors.length;
    const bands = colors.map((c, i) => `<rect x="${(i * w).toFixed(2)}" y="0" width="${(w + 0.4).toFixed(2)}" height="35" fill="${c}"/>`).join('');
    const pinPath = "M12.5 0C5.596 0 0 5.596 0 12.5C0 21.875 12.5 35 12.5 35C12.5 35 25 21.875 25 12.5C25 5.596 19.404 0 12.5 0Z";
    const star = mustSee ? `<g transform="translate(12.5 13)" filter="url(#starShadow${uid})">
      <path d="M0,-8.1 L2.35,-2.65 L6.9,-2.15 L3.15,1.55 L4.25,6.3 L0,4.45 L-4.25,6.3 L-3.15,1.55 L-6.9,-2.15 L-2.35,-2.65 Z" fill="url(#goldStar${uid})" stroke="#3f2b08" stroke-width="1.45" stroke-linejoin="round"/>
      <path d="M0,-6.4 L1.65,-2.1 L4.9,-1.75 L2.2,1.0 L3.1,4.55 L0,3.05 L-3.1,4.55 L-2.2,1.0 L-4.9,-1.75 L-1.65,-2.1 Z" fill="none" stroke="#fff2b2" stroke-width=".65" opacity=".95"/>
      <path d="M-1.5,-5.3 L0,-7 L1.4,-3.2 L-1,-2.8 Z" fill="#fff8d6" opacity=".9"/>
    </g>` : '';
    const svg = `<svg width="39" height="43" viewBox="-3 -3 39 43" xmlns="http://www.w3.org/2000/svg">
      <defs><clipPath id="pc${uid}"><path d="${pinPath}"/></clipPath>
      <linearGradient id="goldStar${uid}" x1="0" y1="-1" x2=".65" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#fff4a8"/><stop offset=".38" stop-color="#f8d64e"/><stop offset=".72" stop-color="#d49a16"/><stop offset="1" stop-color="#8c5a08"/></linearGradient>
      <filter id="starShadow${uid}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.05" result="blur"/><feOffset dy="1" result="offset"/><feComponentTransfer><feFuncA type="linear" slope=".75"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <g clip-path="url(#pc${uid})">${bands}</g>
      <path d="${pinPath}" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      ${star}
    </svg>`;
    return L.divIcon({ className:'custom-svg-pin', html:svg, iconSize:[39,43], iconAnchor:[12.5,40], popupAnchor:[0,-36] });
  }

  // Initialize Map
  const HOTEL_CENTER = [51.5101, -0.1265]; // St Martins Lane Hotel, Covent Garden
  const map = L.map('map').setView(HOTEL_CENTER, 14);

  // Basemap: OpenStreetMap first (as in v1). If OSM refuses the tiles
  // (e.g. page opened without a referrer), switch automatically to Esri.
  const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);
  const esriLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, USGS, and the GIS User Community',
    maxZoom: 19
  });
  let tileErrors = 0;
  osmLayer.on('tileerror', () => {
    if (++tileErrors >= 3 && map.hasLayer(osmLayer)) {
      map.removeLayer(osmLayer);
      esriLayer.addTo(map);
    }
  });


  // ==========================================================
  // LOCATION DATA
  // Every value comes from locations.js. There are NO category
  // defaults: a field that is empty is simply not shown.
  // A trailing * on a value means "lower confidence - verify".
  // ==========================================================

  function getFormattedLoc(loc) {
    const cats = (Array.isArray(loc.cats) && loc.cats.length) ? loc.cats : (loc.cat ? [loc.cat] : []);
    return {
      name: loc.name,
      cats: cats,
      mustSee: cats.includes(MUST_SEE),
      type: loc.type || "Requested",
      lat: loc.lat,
      lng: loc.lng,
      approxCoords: !!loc.approxCoords,
      neighborhood: loc.neighborhood || "",
      address: loc.address || "",
      tube: loc.tube || "",
      setting: loc.setting || "",
      ambiance: loc.ambiance || "",
      reservations: loc.reservations || "",
      hours: loc.hours || "",
      bestTime: loc.bestDaysTime || "",
      worstTime: loc.worstDaysTime || "",
      specialty: loc.specialty || ""
    };
  }

  function catColor(cat) {
    return (categoryColors[cat] && categoryColors[cat].color) || '#3b82f6';
  }

  function escapeHTML(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  let markerStore = [];
  let userMarker = null;

  function detailRow(label, value, cls) {
    return value ? `<div class="${cls || 'popup-row'}"><strong>${label}:</strong> ${escapeHTML(value)}</div>` : '';
  }

  function hasAsterisk(loc) {
    return loc.approxCoords || [loc.address, loc.tube, loc.neighborhood, loc.setting, loc.ambiance, loc.reservations,
      loc.hours, loc.bestTime, loc.worstTime, loc.specialty].some(v => typeof v === 'string' && v.trim().endsWith('*'));
  }

  function buildDetailsHTML(loc) {
    return `
      <div class="popup-details">
        ${detailRow('Address', loc.address)}
        ${detailRow('Neighborhood', loc.neighborhood)}
        ${detailRow('Tube', loc.tube)}
        ${detailRow('Setting', loc.setting)}
        ${detailRow('Ambiance', loc.ambiance)}
        ${detailRow('Reservations', loc.reservations)}
        ${detailRow('Hours', loc.hours)}
        ${detailRow('Best Days/Time', loc.bestTime)}
        ${detailRow('Worst Days/Time', loc.worstTime)}
        ${loc.specialty ? `<div class="detail-specialty"><strong>Specialty / Feature / Main Attraction:</strong><br>${escapeHTML(loc.specialty)}</div>` : ''}
        ${loc.approxCoords ? '<div class="data-note">Map position is approximate*</div>' : ''}
        ${hasAsterisk(loc) ? '<div class="data-note">* Lower-confidence information \u2014 please verify before visiting.</div>' : ''}
      </div>`;
  }

  // Render markers and popups.
  function loadMarkers() {
    rawLocations.forEach((raw, i) => {
      if (!raw || !raw.name || typeof raw.lat !== 'number' || typeof raw.lng !== 'number') {
        console.warn(`locations.js: entry #${i + 1} skipped (needs name, lat and lng as numbers):`, raw);
        return;
      }
      const loc = getFormattedLoc(raw);
      if (loc.cats.length === 0) { console.warn(`locations.js: "${raw.name}" has no category (use cats: ["..."]).`); return; }
      loc.cats.forEach(c => { if (!categoryColors[c]) console.warn(`locations.js: "${raw.name}" uses unknown category "${c}" (add it to categoryColors).`); });
      if (raw.type && raw.type !== "Requested" && raw.type !== "Suggested") console.warn(`locations.js: "${raw.name}" has type "${raw.type}"; use "Requested" or "Suggested".`);

      const colors = loc.cats.map(catColor);
      const m = L.marker([loc.lat, loc.lng], { icon: createPinIcon(colors, loc.mustSee) }).addTo(map);

      const typeBadgeClass = loc.type === "Suggested" ? "badge-suggested" : "badge-requested";
      const catLine = loc.cats.map(c => `<span style="color:${catColor(c)}">${escapeHTML(c)}</span>`).join(' \u2022 ');

      const popupHTML = `
        <div class="popup-title-container">
          <div class="popup-title">${escapeHTML(loc.name)}</div>
          <span class="badge-container">
            ${loc.mustSee ? '<span class="sidebar-badge badge-must">\u2605 Must See</span>' : ''}
            <span class="sidebar-badge ${typeBadgeClass}">${escapeHTML(loc.type)}</span>
          </span>
        </div>
        <div class="popup-cats">${catLine}</div>
        ${buildDetailsHTML(loc)}
        <div class="popup-link">
          <a href="https://www.google.com/maps/dir/?api=1&destination=${loc.lat}%2C${loc.lng}&travelmode=walking" target="_blank" rel="noopener">
            \ud83d\uddfa\ufe0f Open Directions in Google Maps
          </a>
        </div>
      `;

      m.bindPopup(popupHTML, { maxWidth: 340 });
      markerStore.push({ marker: m, data: loc });
    });

    updateSidebar(markerStore);
  }

  // ----- Sidebar grouping state -----
  // Every category starts collapsed on launch.
  const openCats = new Set();      // groups the user opened (normal mode)
  const filterClosed = new Set();  // groups the user closed while a search/filter is active

  // Set when the Requested/Suggested boxes change: groups then reset to collapsed,
  // even if a search is active. Cleared again as soon as search/category changes.
  let suspendAutoExpand = false;

  // Searching or picking a category auto-expands the groups that have matches.
  // (The Requested/Suggested checkboxes do not: they reset everything to collapsed.)
  function filtersActive() {
    return document.getElementById('search-box').value.trim() !== '' ||
           document.getElementById('category-select').value !== 'ALL' ||
           document.getElementById('chk-must').checked;
  }
  function autoExpanding() {
    return filtersActive() && !suspendAutoExpand;
  }

  // Expand all / Collapse all buttons: act on the groups currently shown.
  function setAllGroups(open) {
    const auto = autoExpanding();
    document.querySelectorAll('#sidebar-list .cat-group').forEach(group => {
      const cat = group.dataset.cat;
      group.classList.toggle('open', open);
      group.querySelector('.cat-header').setAttribute('aria-expanded', String(open));
      if (auto) { open ? filterClosed.delete(cat) : filterClosed.add(cat); }
      else      { open ? openCats.add(cat)       : openCats.delete(cat); }
    });
  }

  // MUST SEE is deliberately first; every other category is alphabetized identically
  // in the top picker and sidebar. Category colors remain sourced from locations.js.
  function categoryOrder() {
    const all = Object.keys(categoryColors);
    rawLocations.forEach(l => {
      const cs = (l && Array.isArray(l.cats)) ? l.cats : (l && l.cat ? [l.cat] : []);
      cs.forEach(c => { if (!all.includes(c)) all.push(c); });
    });
    return [MUST_SEE, ...all.filter(c => c !== MUST_SEE).sort((a,b) => a.localeCompare(b, 'en', {sensitivity:'base'}))];
  }

  function populateCategorySelect() {
    const sel = document.getElementById('category-select');
    categoryOrder().forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      sel.appendChild(opt);
    });
    const allOpt = document.createElement('option');
    allOpt.value = 'ALL'; allOpt.textContent = 'All Categories';
    sel.insertBefore(allOpt, sel.options[1] || null);
  }

  function buildSidebarItem(item) {
    const li = document.createElement('li');
    li.className = 'sidebar-item';

    const d = item.data;
    const typeBadgeClass = d.type === "Suggested" ? "badge-suggested" : "badge-requested";
    const chips = d.cats.map(c => `<span class="cat-chip"><i style="background:${catColor(c)}"></i>${escapeHTML(c)}</span>`).join('');
    const sub = [d.neighborhood ? `\ud83d\udccd ${escapeHTML(d.neighborhood)}` : '', d.tube ? `\ud83d\ude87 ${escapeHTML(d.tube)}` : ''].filter(Boolean).join(' | ');

    li.innerHTML = `
      <div class="sidebar-title">${escapeHTML(d.name)}</div>
      ${sub ? `<div class="sidebar-sub">${sub}</div>` : ''}
      <div class="cat-chips">${chips}</div>
      <div class="badge-container">
        ${d.mustSee ? '<span class="sidebar-badge badge-must">\u2605 Must See</span>' : ''}
        <span class="sidebar-badge ${typeBadgeClass}">${escapeHTML(d.type)}</span>
      </div>
      <div class="sidebar-detail">
        ${detailRow('Address', d.address, 'detail-row')}
        ${detailRow('Setting', d.setting, 'detail-row')}
        ${detailRow('Ambiance', d.ambiance, 'detail-row')}
        ${detailRow('Reservations', d.reservations, 'detail-row')}
        ${detailRow('Hours', d.hours, 'detail-row')}
        ${detailRow('Best', d.bestTime, 'detail-row')}
        ${detailRow('Worst', d.worstTime, 'detail-row')}
        ${d.specialty ? `<div class="detail-specialty"><strong>Specialty / Feature:</strong><br>${escapeHTML(d.specialty)}</div>` : ''}
        ${hasAsterisk(d) ? '<div class="data-note">* Lower-confidence information \u2014 verify before visiting.</div>' : ''}
      </div>
    `;

    li.onclick = () => {
      document.querySelectorAll('.sidebar-item.expanded').forEach(el => {
        if (el !== li) el.classList.remove('expanded');
      });
      li.classList.toggle('expanded');
      map.setView([item.data.lat, item.data.lng], 16);
      item.marker.openPopup();
    };
    return li;
  }

  function updateSidebar(visibleItems) {
    const listEl = document.getElementById('sidebar-list');
    const countEl = document.getElementById('location-count');
    listEl.innerHTML = '';
    countEl.textContent = visibleItems.length;

    const active = autoExpanding();

    const groups = new Map();
    categoryOrder().forEach(cat => groups.set(cat, []));
    visibleItems.forEach(item => {
      item.data.cats.forEach(c => {
        if (!groups.has(c)) groups.set(c, []);
        groups.get(c).push(item);
      });
    });

    groups.forEach((items, cat) => {
      if (items.length === 0) return;

      const color = (categoryColors[cat] && categoryColors[cat].color) || '#3b82f6';
      // Collapsed by default; while searching/filtering, groups with matches open automatically.
      const isOpen = active ? !filterClosed.has(cat) : openCats.has(cat);

      const group = document.createElement('li');
      group.className = 'cat-group' + (isOpen ? ' open' : '');
      group.dataset.cat = cat;

      const header = document.createElement('div');
      header.className = 'cat-header';
      header.setAttribute('role', 'group');
      header.setAttribute('aria-label', `${cat} category controls`);
      header.setAttribute('aria-expanded', String(isOpen));
      header.style.setProperty('--cat-color', color);
      const activeCat = document.getElementById('category-select').value === cat;
      header.innerHTML = `
        <button type="button" class="cat-expand-button" aria-label="${isOpen ? 'Collapse' : 'Expand'} ${escapeHTML(cat)}" aria-expanded="${isOpen}">▶</button>
        <span class="cat-dot" style="background:${color}"></span>
        <button type="button" class="cat-filter-button" aria-pressed="${activeCat}">${escapeHTML(cat)}</button>
        <span class="cat-count">${items.length}</span>`;
      if (activeCat) header.classList.add('active-category');
      const expandButton = header.querySelector('.cat-expand-button');
      expandButton.onclick = (event) => {
        event.stopPropagation();
        const nowOpen = !group.classList.contains('open');
        group.classList.toggle('open', nowOpen);
        expandButton.setAttribute('aria-expanded', String(nowOpen));
        expandButton.setAttribute('aria-label', `${nowOpen ? 'Collapse' : 'Expand'} ${cat}`);
        if (autoExpanding()) { nowOpen ? filterClosed.delete(cat) : filterClosed.add(cat); }
        else                 { nowOpen ? openCats.add(cat)       : openCats.delete(cat); }
      };
      header.querySelector('.cat-filter-button').onclick = (event) => {
        event.stopPropagation();
        const sel = document.getElementById('category-select');
        sel.value = cat;
        const mustBox = document.getElementById('chk-must');
        mustBox.checked = cat === MUST_SEE;
        filterMarkers();
      };

      const body = document.createElement('ul');
      body.className = 'cat-body';
      items.forEach(item => body.appendChild(buildSidebarItem(item)));

      group.appendChild(header);
      group.appendChild(body);
      listEl.appendChild(group);
    });
  }

  // collapse === true when called from the Requested/Suggested checkboxes.
  function filterMarkers(collapse) {
    filterClosed.clear();
    suspendAutoExpand = (collapse === true);
    if (collapse === true) openCats.clear();
    const searchVal = document.getElementById('search-box').value.trim().toLowerCase();
    const catVal = document.getElementById('category-select').value;
    const showRequested = document.getElementById('chk-requested').checked;
    const showSuggested = document.getElementById('chk-suggested').checked;
    const mustOnly = document.getElementById('chk-must').checked;

    const visibleItems = [];

    markerStore.forEach(item => {
      const d = item.data;
      const searchable = [
        d.name, d.cats.join(' '), d.type, d.neighborhood, d.tube, d.address,
        d.setting, d.ambiance, d.reservations, d.hours, d.bestTime, d.worstTime, d.specialty
      ].join(" ").toLowerCase();

      const matchesSearch = !searchVal || searchable.includes(searchVal);
      const matchesCat = catVal === 'ALL' || d.cats.includes(catVal);
      const matchesMust = !mustOnly || d.mustSee;
      const matchesType =
        (d.type === 'Requested' && showRequested) ||
        (d.type === 'Suggested' && showSuggested);

      if (matchesSearch && matchesCat && matchesMust && matchesType) {
        if (!map.hasLayer(item.marker)) map.addLayer(item.marker);
        visibleItems.push(item);
      } else if (map.hasLayer(item.marker)) {
        map.removeLayer(item.marker);
      }
    });

    updateSidebar(visibleItems);
  }

  // Must See checkbox and the MUST SEE dropdown entry behave the same way.
  function mustChanged() {
    const sel = document.getElementById('category-select');
    const on = document.getElementById('chk-must').checked;
    if (on && sel.value === 'ALL') sel.value = MUST_SEE;
    if (!on && sel.value === MUST_SEE) sel.value = 'ALL';
    filterMarkers(true);
  }
  function catChanged() {
    const sel = document.getElementById('category-select');
    const box = document.getElementById('chk-must');
    if (sel.value === MUST_SEE) box.checked = true;
    else if (sel.value === 'ALL') box.checked = false;
    filterMarkers();
  }

  function resetFilters() {
    document.getElementById('search-box').value = '';
    document.getElementById('category-select').value = 'ALL';
    document.getElementById('chk-requested').checked = true;
    document.getElementById('chk-suggested').checked = true;
    document.getElementById('chk-must').checked = false;
    filterMarkers();

    if (userMarker) {
      map.removeLayer(userMarker);
      userMarker = null;
    }

    setInitialMapPosition(HOTEL_CENTER);
  }

  function locateUser() {
    if (!navigator.geolocation) {
      alert("Geolocation is not supported by your browser.");
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const uLat = pos.coords.latitude;
        const uLng = pos.coords.longitude;

        if (userMarker) map.removeLayer(userMarker);

        userMarker = L.circleMarker([uLat, uLng], {
          radius: 9,
          fillColor: '#2563eb',
          color: '#ffffff',
          weight: 3,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(map).bindPopup("<b>You Are Here</b>").openPopup();

        let closest = null;
        let minDistance = Infinity;

        markerStore.forEach(item => {
          if (map.hasLayer(item.marker)) {
            const loc = item.data;
            const dist = map.distance([uLat, uLng], [loc.lat, loc.lng]);
            if (dist < minDistance) {
              minDistance = dist;
              closest = loc;
            }
          }
        });

        if (closest) {
          map.setView([uLat, uLng], 15);
          alert(`Nearest visible spot is "${closest.name}" (${Math.round(minDistance)} meters away).`);
        } else {
          map.setView([uLat, uLng], 14);
        }
      },
      () => alert("Unable to retrieve your current location. Please check GPS permissions.")
    );
  }


  // ----- About dialog -----
  function formatRevisionDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    if (!m) return s || 'Unknown';
    return new Date(+m[1], +m[2] - 1, +m[3])
      .toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }
  function showAbout() {
    document.getElementById('about-date').textContent =
      formatRevisionDate(typeof LAST_REVISED !== 'undefined' ? LAST_REVISED : '');
    document.getElementById('about-count').textContent = markerStore.length;
    document.getElementById('about-overlay').classList.add('show');
  }
  function hideAbout() {
    document.getElementById('about-overlay').classList.remove('show');
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hideAbout(); });

  // Draggable divider: adjusts sidebar width on desktop/landscape and height in portrait.
  (function setupResizablePanels() {
    const handle = document.getElementById('resize-handle');
    const sidebar = document.getElementById('sidebar');
    const workspace = document.getElementById('main-content');
    if (!handle || !sidebar || !workspace) return;
    let dragging = false;
    const isPortraitPhone = () => window.matchMedia('(max-width: 700px) and (orientation: portrait)').matches;
    handle.addEventListener('pointerdown', e => {
      dragging = true;
      handle.classList.add('dragging');
      handle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    handle.addEventListener('pointermove', e => {
      if (!dragging) return;
      const rect = workspace.getBoundingClientRect();
      if (isPortraitPhone()) {
        const h = Math.max(90, Math.min(rect.height - 100, rect.bottom - e.clientY));
        sidebar.style.flexBasis = `${h}px`;
      } else {
        const w = Math.max(170, Math.min(rect.width * 0.65, e.clientX - rect.left));
        sidebar.style.flexBasis = `${w}px`;
      }
      map.invalidateSize({ pan:false });
    });
    const stop = () => { dragging = false; handle.classList.remove('dragging'); };
    handle.addEventListener('pointerup', stop);
    handle.addEventListener('pointercancel', stop);
    handle.addEventListener('keydown', e => {
      if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) return;
      e.preventDefault();
      if (isPortraitPhone()) {
        const current = sidebar.getBoundingClientRect().height;
        sidebar.style.flexBasis = `${Math.max(90, current + (e.key === 'ArrowUp' ? 25 : e.key === 'ArrowDown' ? -25 : 0))}px`;
      } else {
        const current = sidebar.getBoundingClientRect().width;
        sidebar.style.flexBasis = `${Math.max(170, current + (e.key === 'ArrowRight' ? 25 : e.key === 'ArrowLeft' ? -25 : 0))}px`;
      }
      map.invalidateSize({ pan:false });
    });
    window.addEventListener('resize', () => map.invalidateSize({ pan:false }));
  })();


  // Approximate UK land envelope with Ireland excluded; GPS is used only when
  // the reported point falls within this UK test. GPS failures fall back to hotel.
  function isWithinUK(lat, lng) {
    const inGreatBritain = lat >= 49.8 && lat <= 59.5 && lng >= -6.5 && lng <= 1.9;
    const inNorthernIreland = lat >= 54.0 && lat <= 55.35 && lng >= -8.2 && lng <= -5.3;
    return inGreatBritain || inNorthernIreland;
  }

  function calculateInitialZoom(center) {
    const distances = markerStore.map(x => map.distance(center, [x.data.lat, x.data.lng])).sort((a,b) => a-b);
    if (!distances.length) return 14;
    const radius70 = distances[Math.min(distances.length - 1, Math.floor((distances.length - 1) * 0.70))];
    const rect = document.getElementById('map').getBoundingClientRect();
    const usableRadiusPx = Math.max(150, Math.min(rect.width, rect.height) * 0.42);
    const metersPerPixelAtZoom0 = 156543.03392 * Math.cos(center[0] * Math.PI / 180);
    const rawZoom = Math.log2((usableRadiusPx * metersPerPixelAtZoom0) / Math.max(radius70, 250));
    return Math.max(12, Math.min(16, Math.floor(rawZoom)));
  }

  function setInitialMapPosition(center) {
    const zoom = calculateInitialZoom(center);
    map.setView(center, Math.max(14, zoom), { animate:false });
    setTimeout(() => map.invalidateSize({ pan:false }), 100);
  }

  function initializeMapPosition() {
    setInitialMapPosition(HOTEL_CENTER);
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(pos => {
      const point = [pos.coords.latitude, pos.coords.longitude];
      if (isWithinUK(point[0], point[1])) setInitialMapPosition(point);
      else setInitialMapPosition(HOTEL_CENTER);
    }, () => setInitialMapPosition(HOTEL_CENTER), { enableHighAccuracy:false, timeout:7000, maximumAge:300000 });
  }

  populateCategorySelect();
  loadMarkers();
  initializeMapPosition();
</script>
</body>
